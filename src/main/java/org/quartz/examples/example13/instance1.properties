#============================================================================
#============================================================================
# 配置数据源 - PostgreSQL 数据库连接配置
#============================================================================

# JDBC 驱动类
org.quartz.dataSource.myDS.driver: org.postgresql.Driver
# 数据库连接 URL - 请根据实际环境修改主机、端口和数据库名
org.quartz.dataSource.myDS.URL: jdbc:postgresql://localhost:5432/quartz
# 数据库用户名
org.quartz.dataSource.myDS.user: quartz
# 数据库密码
org.quartz.dataSource.myDS.password: quartz
# 最大连接数 - 根据并发需求调整
org.quartz.dataSource.myDS.maxConnections: 5
# 连接验证查询 - 用于检测连接是否有效
org.quartz.dataSource.myDS.validationQuery: select 1

# 注意事项:
# 1. 确保 PostgreSQL 服务正在运行
# 2. 数据库 'quartz' 必须存在
# 3. 用户 'quartz' 必须有读写权限
# 4. 必须先执行 Quartz 的数据库初始化脚本

#============================================================================
# 配置插件 - 日志记录和监控插件
#============================================================================

# 触发器历史日志插件 - 记录触发器的触发和完成事件
org.quartz.plugin.triggHistory.class: org.quartz.plugins.history.LoggingTriggerHistoryPlugin
# 触发器触发时的日志消息格式
org.quartz.plugin.triggHistory.triggerFiredMessage: 触发器 {1}.{0} 在 {4, date, HH:mm:ss MM/dd/yyyy} 触发了任务 {6}.{5}
# 触发器完成时的日志消息格式
org.quartz.plugin.triggHistory.triggerCompleteMessage: 触发器 {1}.{0} 在 {4, date, HH:mm:ss MM/dd/yyyy} 完成了任务 {6}.{5} 的触发，结果代码: {9}

# 任务历史日志插件 - 记录任务的执行过程
org.quartz.plugin.jobHistory.class: org.quartz.plugins.history.LoggingJobHistoryPlugin
# 任务即将执行时的日志消息格式
org.quartz.plugin.jobHistory.jobToBeFiredMessage: 任务 {1}.{0} 在 {2, date, HH:mm:ss MM/dd/yyyy} 被触发器 {4}.{3} 触发
# 任务执行成功时的日志消息格式
org.quartz.plugin.jobHistory.jobSuccessMessage: 任务 {1}.{0} 在 {2, date, HH:mm:ss MM/dd/yyyy} 执行完成，报告: {8}
# 任务执行失败时的日志消息格式
org.quartz.plugin.jobHistory.jobFailedMessage: 任务 {1}.{0} 在 {2, date, HH:mm:ss MM/dd/yyyy} 执行失败，报告: {8}
# 任务被否决时的日志消息格式
org.quartz.plugin.jobHistory.jobWasVetoedMessage: 任务 {1}.{0} 被否决，原计划在 {2, date, HH:mm:ss MM/dd/yyyy} 由触发器 {4}.{3} 触发
