# Quartz 客户端配置文件
# 用于 StdSchedulerFactory 创建 Quartz 调度器实例
# 此配置文件专门用于 RMI 客户端，连接到远程 Quartz 服务器
#

# 配置调度器主要属性 ============================================

# 调度器实例名称，用于标识此客户端调度器
org.quartz.scheduler.instanceName: Sched1

# 调度器日志记录器名称
org.quartz.scheduler.logger: schedLogger

# 跳过 Quartz 版本更新检查，提高启动速度
org.quartz.scheduler.skipUpdateCheck: true

# 启用 RMI 代理模式，表示此调度器将作为远程调度器的客户端
org.quartz.scheduler.rmi.proxy: true

# RMI 注册表主机地址
# 如果服务器在不同机器上，请修改为服务器的 IP 地址或主机名
org.quartz.scheduler.rmi.registryHost: localhost

# RMI 注册表端口号，必须与服务器端配置一致
org.quartz.scheduler.rmi.registryPort: 1099
