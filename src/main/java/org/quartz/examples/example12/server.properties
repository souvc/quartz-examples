#============================================================================
# 配置调度器主要属性
# 此配置文件用于 RMI 服务器端，提供远程任务调度服务
#============================================================================

# 调度器实例名称，用于标识此服务器调度器
org.quartz.scheduler.instanceName: Sched1

# 启用 RMI 导出，使调度器可以被远程客户端访问
org.quartz.scheduler.rmi.export: true

# RMI 注册表主机地址，通常设置为 localhost
org.quartz.scheduler.rmi.registryHost: localhost

# RMI 注册表端口号，客户端需要使用相同端口连接
org.quartz.scheduler.rmi.registryPort: 1099

# 自动创建 RMI 注册表，如果注册表不存在则创建
org.quartz.scheduler.rmi.createRegistry: true

# 跳过 Quartz 版本更新检查，提高启动速度
org.quartz.scheduler.skipUpdateCheck: true

#============================================================================
# 配置线程池
# 线程池负责执行调度的任务
#============================================================================

# 线程池实现类，使用 Quartz 提供的简单线程池
org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool

# 线程池中的线程数量，决定了可以并发执行的任务数
org.quartz.threadPool.threadCount: 10

# 线程优先级，范围 1-10，5 为普通优先级
org.quartz.threadPool.threadPriority: 5

#============================================================================
# 配置任务存储（JobStore）
# JobStore 负责存储任务和触发器信息
#============================================================================

# 错过触发阈值（毫秒），超过此时间的触发被认为是错过的
# 60000 毫秒 = 1 分钟
org.quartz.jobStore.misfireThreshold: 60000

# 任务存储实现类，使用内存存储（RAMJobStore）
# 注意：内存存储在应用重启后会丢失所有任务数据
# 生产环境建议使用数据库存储（如 JobStoreTX）
org.quartz.jobStore.class: org.quartz.simpl.RAMJobStore
