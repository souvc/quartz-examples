#============================================================================
# MySQL 集群配置文件 - 实例2
# 本文件用于配置连接 MySQL 数据库的 Quartz 集群环境中的第二个调度器实例
#============================================================================

# 调度器实例名称 - 集群中所有实例应使用相同名称
org.quartz.scheduler.instanceName: MySQLClusterScheduler
# 调度器实例ID - 集群中每个实例必须唯一，建议使用 AUTO 自动生成
org.quartz.scheduler.instanceId: AUTO

# 跳过更新检查，避免启动时的网络请求
org.quartz.scheduler.skipUpdateCheck: true

# 设置 RMI 导出和绑定为 false，避免端口冲突
org.quartz.scheduler.rmi.export: false
org.quartz.scheduler.rmi.proxy: false

#============================================================================
# 配置线程池 - 控制并发执行的任务数量
#============================================================================

# 线程池实现类 - 使用简单线程池
org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
# 线程池大小 - 同时执行的最大任务数
org.quartz.threadPool.threadCount: 10
# 线程优先级 - 1(最低)到10(最高)，5为默认值
org.quartz.threadPool.threadPriority: 5

#============================================================================
# 配置 JobStore - MySQL 数据库持久化存储配置
#============================================================================

# 使用 JDBC JobStore 实现
org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX

# 数据库驱动代理类 - 用于 MySQL
org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate

# 数据库表前缀 - Quartz 表的前缀
org.quartz.jobStore.tablePrefix: QRTZ_

# 数据源名称
org.quartz.jobStore.dataSource: myDS

# 启用集群模式 - 这是关键配置
org.quartz.jobStore.isClustered: true

# 集群检查间隔（毫秒）- 调度器检查其他实例状态的频率
org.quartz.jobStore.clusterCheckinInterval: 20000

# 错过触发阈值（毫秒）- 超过此时间的触发被认为是错过的
org.quartz.jobStore.misfireThreshold: 60000

# 最大错过触发处理数量
org.quartz.jobStore.maxMisfiresToHandleAtATime: 20

# 不使用数据库锁（MySQL 支持行级锁）
org.quartz.jobStore.dontSetAutoCommitFalse: false

# 选择锁处理方式 - 使用数据库锁
org.quartz.jobStore.acquireTriggersWithinLock: false

#============================================================================
# 配置数据源 - MySQL 数据库连接配置
#============================================================================

# JDBC 驱动类
org.quartz.dataSource.myDS.driver: com.mysql.cj.jdbc.Driver

# 数据库连接 URL
# 请根据您的 MySQL 服务器配置修改以下参数：
# - localhost:3306 改为您的 MySQL 服务器地址和端口
# - quartz_db 改为您的数据库名称
org.quartz.dataSource.myDS.URL: jdbc:mysql://localhost:3307/quartz_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# 数据库用户名 - 请修改为您的 MySQL 用户名
org.quartz.dataSource.myDS.user: root

# 数据库密码 - 请修改为您的 MySQL 密码
org.quartz.dataSource.myDS.password: 123456

# 连接池最大连接数
org.quartz.dataSource.myDS.maxConnections: 10

# 连接验证查询
org.quartz.dataSource.myDS.validationQuery: SELECT 1

# 连接空闲超时时间（秒）
org.quartz.dataSource.myDS.idleConnectionValidationSeconds: 50

# 最大空闲时间（秒）
org.quartz.dataSource.myDS.maxIdleTime: 300

#============================================================================
# 日志配置
#============================================================================

# 启用详细日志记录
org.quartz.scheduler.wrapJobExecutionInUserTransaction: false

#============================================================================
# 插件配置 - 可选
#============================================================================

# 启用调度器历史插件（可选）
# org.quartz.plugin.history.class: org.quartz.plugins.history.LoggingJobHistoryPlugin
# org.quartz.plugin.history.jobSuccessMessage: [实例2] 任务 [{1}.{0}] 执行成功，耗时: {2}ms，下次执行时间: {4}
# org.quartz.plugin.history.jobFailedMessage: [实例2] 任务 [{1}.{0}] 执行失败: {8}

# 启用关闭钩子插件（推荐）
org.quartz.plugin.shutdownhook.class: org.quartz.plugins.management.ShutdownHookPlugin
org.quartz.plugin.shutdownhook.cleanShutdown: true

#============================================================================
# 实例2特殊配置说明
#============================================================================
# 本配置文件用于第二个调度器实例，主要区别：
# 1. 实例ID使用AUTO自动生成，确保与实例1不同
# 2. 连接相同的MySQL数据库，实现集群共享
# 3. 日志消息可以添加[实例2]前缀便于区分
# 4. 其他配置与实例1保持一致，确保集群兼容性
#============================================================================

#============================================================================
# 重要提示
#============================================================================
# 1. 此实例必须与实例1连接到同一个 MySQL 数据库
# 2. 确保数据库连接参数与实例1完全一致
# 3. 实例ID会自动生成，无需手动指定
# 4. 建议在启动实例2时使用 "dontScheduleJobs" 参数
# 5. 可以通过日志观察任务在两个实例间的分布情况
# 6. 测试故障转移时，可以关闭其中一个实例观察效果
#============================================================================