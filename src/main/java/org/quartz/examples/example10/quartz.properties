
#============================================================================
# 调度器主要属性配置
# 这部分配置定义了调度器的基本特性，包括名称、ID和更新检查设置
#============================================================================

# 调度器实例名称，用于在日志和JMX中标识此调度器
org.quartz.scheduler.instanceName: TestScheduler
# 调度器实例ID，设为AUTO表示自动生成唯一ID
org.quartz.scheduler.instanceId: AUTO

# 跳过Quartz版本更新检查，提高启动速度
org.quartz.scheduler.skipUpdateCheck: true

#============================================================================
# 线程池配置
# 配置调度器使用的线程池，决定了并发执行任务的能力
#============================================================================

# 线程池实现类，使用简单线程池
org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
# 线程池中的线程数量，决定了可以并发执行的任务数
org.quartz.threadPool.threadCount: 3
# 线程优先级，范围1-10，5为普通优先级
org.quartz.threadPool.threadPriority: 5

#============================================================================
# 任务存储配置
# 配置任务和触发器的存储方式，支持内存存储和数据库存储
#============================================================================

# 任务错过触发的阈值时间（毫秒），超过此时间的触发被认为是错过的
org.quartz.jobStore.misfireThreshold: 60000

# 使用内存任务存储，适合演示和开发环境
org.quartz.jobStore.class: org.quartz.simpl.RAMJobStore

# 以下是数据库任务存储的配置示例（已注释）
# 适用于生产环境，支持集群和持久化
#org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
#org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
#org.quartz.jobStore.useProperties: false
#org.quartz.jobStore.dataSource: myDS
#org.quartz.jobStore.tablePrefix: QRTZ_
#org.quartz.jobStore.isClustered: false

#============================================================================
# 数据源配置
# 当使用数据库任务存储时需要配置数据源连接信息
#============================================================================

# 数据库驱动类（PostgreSQL示例）
#org.quartz.dataSource.myDS.driver: org.postgresql.Driver
# 数据库连接URL
#org.quartz.dataSource.myDS.URL: jdbc:postgresql://localhost/dev
# 数据库用户名
#org.quartz.dataSource.myDS.user: jhouse
# 数据库密码
#org.quartz.dataSource.myDS.password: 
# 最大连接数
#org.quartz.dataSource.myDS.maxConnections: 5



#============================================================================
# 插件配置
# 配置Quartz插件，扩展调度器功能
#============================================================================

# 历史日志记录插件：记录任务执行的历史信息
# 自动监听任务的执行、完成、失败等事件，并输出到日志
org.quartz.plugin.triggHistory.class: org.quartz.plugins.history.LoggingJobHistoryPlugin

# XML任务初始化插件：从XML文件加载任务和触发器定义
org.quartz.plugin.jobInitializer.class: org.quartz.plugins.xml.XMLSchedulingDataProcessorPlugin
# 指定XML配置文件名，支持多个文件用逗号分隔
org.quartz.plugin.jobInitializer.fileNames: quartz_data.xml
# 当指定的XML文件不存在时是否抛出异常
org.quartz.plugin.jobInitializer.failOnFileNotFound: true
# XML文件扫描间隔（秒），用于检测文件变化并重新加载
org.quartz.plugin.jobInitializer.scanInterval: 120
# 是否将XML处理包装在用户事务中
org.quartz.plugin.jobInitializer.wrapInUserTransaction: false